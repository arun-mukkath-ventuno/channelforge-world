; Single-image world supervisor config (docs/devops-single-image.md §4, §8).
;
; Priority tiers match the spec's runtime process/port map exactly: 10 (data stores + MinIO +
; local stub, no dependencies), 20 (the two APIs), 25 (workers, depend on their API/stores), 30
; (SSAI data plane + nginx edge), 40 (fast-world-tv, depends on everything below it). supervisord
; only orders *start attempts* by priority — it has no native depends_on — so every program with
; a real dependency edge blocks on wait-for-tcp.sh before execing its real process (§8: "each
; restart verb still needs its own explicit readiness guard for whatever it depends on, rather
; than assuming supervisord's priority table enforces it").
;
; autorestart=true everywhere per §8: "supervisord must detect and restart unexpected service
; exits... the actual long-running process, not an immortal wrapper whose child can die
; unnoticed" — every command= below execs the real process as the last step (no lingering shell
; wrapping it), so supervisord's own child-exit detection sees the real process die, not a shell.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── Priority 10: data stores, MinIO, local stub — no dependencies ───────────────────────────

[program:cf-postgres]
priority=10
user=postgres
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/cf-data -p 5432 -k /var/run/postgresql/cf
autorestart=true
stdout_logfile=/var/log/supervisor/cf-postgres.log
stderr_logfile=/var/log/supervisor/cf-postgres.log

[program:cf-redis]
priority=10
user=redis
command=redis-server --port 6379 --dir /var/lib/redis/cf --unixsocket /var/run/redis/cf.sock
autorestart=true
stdout_logfile=/var/log/supervisor/cf-redis.log
stderr_logfile=/var/log/supervisor/cf-redis.log

[program:ssai-postgres]
priority=10
user=postgres
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/ssai-data -p 5433 -k /var/run/postgresql/ssai
autorestart=true
stdout_logfile=/var/log/supervisor/ssai-postgres.log
stderr_logfile=/var/log/supervisor/ssai-postgres.log

[program:ssai-redis]
priority=10
user=redis
command=redis-server --port 6380 --dir /var/lib/redis/ssai --unixsocket /var/run/redis/ssai.sock
autorestart=true
stdout_logfile=/var/log/supervisor/ssai-redis.log
stderr_logfile=/var/log/supervisor/ssai-redis.log

[program:minio]
priority=10
environment=MINIO_ROOT_USER="worldminio",MINIO_ROOT_PASSWORD="worldminio-secret"
command=/usr/local/bin/minio server /var/lib/minio/data --address :9000 --console-address :9001
autorestart=true
stdout_logfile=/var/log/supervisor/minio.log
stderr_logfile=/var/log/supervisor/minio.log

[program:local-stub]
priority=10
command=python3 /opt/local-stub/stub_server.py
autorestart=true
stdout_logfile=/var/log/supervisor/local-stub.log
stderr_logfile=/var/log/supervisor/local-stub.log

; ── Priority 20: the two APIs — depend on their own store(s) + MinIO ────────────────────────

[program:cf-api]
priority=20
directory=/app
environment=DATABASE_URL="postgresql+psycopg://channelforge:world@127.0.0.1:5432/channelforge",REDIS_URL="redis://127.0.0.1:6379/0",APP_ENV="development",SESSION_SECRET="world-session-secret",ENCRYPTION_KEY="world-encryption-key-0000000000000000",CF_ORIGIN_BASE_URL="http://127.0.0.1:8080/hls",CF_SSAI_BASE_URL="http://127.0.0.1:4000",CF_SSAI_ADMIN_USER="world-ssai-admin",CF_SSAI_ADMIN_PASSWORD="world-ssai-admin-secret"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 5432 && /opt/wait-for-tcp.sh 127.0.0.1 6379 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
autorestart=true
stdout_logfile=/var/log/supervisor/cf-api.log
stderr_logfile=/var/log/supervisor/cf-api.log

[program:ssai-control]
priority=20
directory=/ssai
environment=SSAI_SERVICE="control-plane",CONTROL_PLANE_PORT="4000",DATABASE_URL="postgres://ssai:ssai@127.0.0.1:5433/ssai",REDIS_URL="redis://127.0.0.1:6380",DATA_PLANE_PUBLIC_URL="http://127.0.0.1:4010",SESSION_SIGNING_SECRET="world-ssai-session-secret",ADMIN_USER="world-ssai-admin",ADMIN_PASSWORD="world-ssai-admin-secret",CREATIVE_STORE_ROOT="/data/creatives"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 5433 && /opt/wait-for-tcp.sh 127.0.0.1 6380 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && exec node packages/control-plane/dist/server.js'
autorestart=true
stdout_logfile=/var/log/supervisor/ssai-control.log
stderr_logfile=/var/log/supervisor/ssai-control.log

; ── Priority 25: workers — depend on their API/store(s) ─────────────────────────────────────

[program:cf-scheduler]
priority=25
directory=/app
environment=DATABASE_URL="postgresql+psycopg://channelforge:world@127.0.0.1:5432/channelforge",REDIS_URL="redis://127.0.0.1:6379/0",SESSION_SECRET="world-session-secret",ENCRYPTION_KEY="world-encryption-key-0000000000000000"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 5432 && /opt/wait-for-tcp.sh 127.0.0.1 6379 && exec python3 -m app.jobs.scheduler'
autorestart=true
stdout_logfile=/var/log/supervisor/cf-scheduler.log
stderr_logfile=/var/log/supervisor/cf-scheduler.log

; autostart=false: ChannelForge's own services/media-worker/worker/run.py is an upstream
; skeleton that unconditionally raises NotImplementedError ("this runner is where the
; queued/polled job loop will live once the background-job framework is chosen" — its own
; docstring). There is no real job loop to supervise yet. Per AGENTS.md rule 4 (base image stays
; pristine, no upstream patches baked in here), this is left disabled rather than patched to fake
; an implementation. Flip to autostart=true once ChannelForge implements the real loop upstream.
[program:cf-media-worker]
priority=25
directory=/media-worker
environment=DATABASE_URL="postgresql+psycopg://channelforge:world@127.0.0.1:5432/channelforge",REDIS_URL="redis://127.0.0.1:6379/0"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 5432 && /opt/wait-for-tcp.sh 127.0.0.1 6379 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && exec python3 -m worker.run'
autostart=false
autorestart=false
stdout_logfile=/var/log/supervisor/cf-media-worker.log
stderr_logfile=/var/log/supervisor/cf-media-worker.log

[program:cf-playout-worker]
priority=25
directory=/playout-worker
environment=DATABASE_URL="postgresql+psycopg://channelforge:world@127.0.0.1:5432/channelforge",REDIS_URL="redis://127.0.0.1:6379/0",CF_HLS_ROOT="/var/lib/channelforge/hls"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 8000 && /opt/wait-for-tcp.sh 127.0.0.1 5432 && /opt/wait-for-tcp.sh 127.0.0.1 6379 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && exec python3 -m worker.main'
autorestart=true
stdout_logfile=/var/log/supervisor/cf-playout-worker.log
stderr_logfile=/var/log/supervisor/cf-playout-worker.log

[program:ssai-creative-worker]
priority=25
directory=/ssai
environment=DATABASE_URL="postgres://ssai:ssai@127.0.0.1:5433/ssai"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 5433 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && exec /opt/restart/loop-ssai-creative-worker.sh'
autorestart=true
stdout_logfile=/var/log/supervisor/ssai-creative-worker.log
stderr_logfile=/var/log/supervisor/ssai-creative-worker.log

; ── Priority 30: SSAI data plane + nginx edge ────────────────────────────────────────────────

[program:ssai-data]
priority=30
directory=/ssai
environment=SSAI_SERVICE="data-plane",DATA_PLANE_PORT="4010",REDIS_URL="redis://127.0.0.1:6380",CONTROL_PLANE_URL="http://127.0.0.1:4000",CHANNELFORGE_ORIGIN_URL="http://127.0.0.1:8080/hls",SESSION_SIGNING_SECRET="world-ssai-session-secret",CREATIVE_STORE_ROOT="/data/creatives"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 4000 && /opt/wait-for-tcp.sh 127.0.0.1 6380 && /opt/wait-for-tcp.sh 127.0.0.1 9000 && /opt/wait-for-tcp.sh 127.0.0.1 8080 && exec node packages/data-plane/dist/server.js'
autorestart=true
stdout_logfile=/var/log/supervisor/ssai-data.log
stderr_logfile=/var/log/supervisor/ssai-data.log

[program:nginx]
priority=30
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 8000 && exec nginx -c /etc/nginx/nginx.conf -g "daemon off;"'
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log

; ── Priority 40: fast-world-tv — depends on the Forge edge + both SSAI planes ───────────────

; FORGE_HLS_BASE/FAST_EPG_10N/NEXT_PUBLIC_* all default to real forge.ventunotech.com/
; ssai.ventunotech.com/vercel.app production hostnames upstream (fast-world-tv/src/lib/
; channels.ts, ssai.ts, site.ts) if left unset — confirmed neither the current
; world/docker-compose.yaml nor any prior world config actually set them, so this closes a real,
; pre-existing gap, not just a new-build concern. NEXT_PUBLIC_SITE_URL/NEXT_PUBLIC_SSAI_BASE are
; also set as Dockerfile-level ENV (see world/image/Dockerfile) since Next.js inlines
; NEXT_PUBLIC_* vars into the client bundle at build time — this supervisord `environment=` line
; alone would be too late for those two (it only reaches `pnpm start`'s runtime, not the earlier
; `pnpm build`), but keeping them here too costs nothing and covers agent-triggered rebuilds via
; restart-fast-web.sh, which inherits the container's Dockerfile-level ENV either way.
[program:fast-web]
priority=40
directory=/fastweb
environment=FAST_HLS_101="http://127.0.0.1:4010/v1/hls/world/channel_101/index.m3u8",FAST_HLS_102="http://127.0.0.1:4010/v1/hls/world/channel_102/index.m3u8",FAST_HLS_103="http://127.0.0.1:4010/v1/hls/world/channel_103/index.m3u8",FAST_HLS_104="http://127.0.0.1:4010/v1/hls/world/channel_104/index.m3u8",FAST_HLS_105="http://127.0.0.1:4010/v1/hls/world/channel_105/index.m3u8",FORGE_HLS_BASE="http://127.0.0.1:8080/hls",FAST_EPG_101="http://127.0.0.1:8080/hls/epg.xml",FAST_EPG_102="http://127.0.0.1:8080/hls/epg.xml",FAST_EPG_103="http://127.0.0.1:8080/hls/epg.xml",FAST_EPG_104="http://127.0.0.1:8080/hls/epg.xml"
command=/bin/bash -c '/opt/wait-for-tcp.sh 127.0.0.1 8080 && /opt/wait-for-tcp.sh 127.0.0.1 4000 && /opt/wait-for-tcp.sh 127.0.0.1 4010 && exec pnpm start'
autorestart=true
stdout_logfile=/var/log/supervisor/fast-web.log
stderr_logfile=/var/log/supervisor/fast-web.log
