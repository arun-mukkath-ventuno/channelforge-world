worker_processes 1;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  # ChannelForge UI + API proxy + raw HLS edge (docs/devops-single-image.md §4: internal port
  # 8080, host-remapped to 18080).
  server {
    listen 8080;
    server_name _;

    root /web/dist;
    index index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://127.0.0.1:8000/health;
    }

    # Playout worker's HLS output — real local bytes, not a stub (spec §4: "the MVP must include
    # the playout worker and edge so this route produces real local bytes").
    location /hls/ {
      alias /var/lib/channelforge/hls/;
      add_header Cache-Control "no-cache";
    }

    # ChannelForge operator frontend (apps/web), built by the "cf-web" stage and rebuilt in
    # place by restart-cf-web.sh.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
